<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    UtsavSandesh Admin Dashboard
  </title>

  <meta
    name="robots"
    content="noindex,nofollow"
  >

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="config.js"></script>

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    defer
  ></script>

  <script
    src="dashboard.js"
    defer
  ></script>

</head>


<body class="bg-slate-950 text-white min-h-screen">

  <!-- LOGIN -->

  <section
    id="loginSection"
    class="min-h-screen flex items-center justify-center p-5"
  >

    <div
      class="w-full max-w-md bg-white/5 border border-white/10 rounded-3xl p-7 backdrop-blur-xl"
    >

      <div class="text-center mb-8">

        <div class="text-4xl mb-3">
          🪔
        </div>

        <h1 class="text-2xl font-bold">
          UtsavSandesh
        </h1>

        <p class="text-slate-400 text-sm mt-2">
          Admin Dashboard
        </p>

      </div>


      <form id="loginForm">

        <label class="block text-sm mb-2">
          Admin Email
        </label>

        <input
          id="email"
          type="email"
          required
          autocomplete="username"
          class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 outline-none focus:border-amber-400 mb-5"
          placeholder="admin@example.com"
        >


        <label class="block text-sm mb-2">
          Password
        </label>

        <input
          id="password"
          type="password"
          required
          autocomplete="current-password"
          class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 outline-none focus:border-amber-400 mb-5"
          placeholder="••••••••"
        >


        <button
          type="submit"
          class="w-full bg-amber-400 text-black font-bold py-3 rounded-xl hover:bg-amber-300 transition"
        >
          Login
        </button>

      </form>


      <p
        id="loginMessage"
        class="text-sm text-center mt-4 text-slate-400"
      ></p>

    </div>

  </section>


  <!-- DASHBOARD -->

  <main
    id="dashboardSection"
    class="hidden"
  >

    <header
      class="border-b border-white/10 bg-slate-950/90 sticky top-0 z-50"
    >

      <div
        class="max-w-7xl mx-auto px-5 py-4 flex items-center justify-between"
      >

        <div>

          <h1 class="font-bold text-lg">
            🪔 UtsavSandesh Admin
          </h1>

          <p
            id="adminEmail"
            class="text-xs text-slate-500"
          ></p>

        </div>


        <button
          id="logoutBtn"
          class="px-4 py-2 rounded-xl bg-white/5 border border-white/10 text-sm"
        >
          Logout
        </button>

      </div>

    </header>


    <div
      class="max-w-7xl mx-auto p-5 grid lg:grid-cols-[420px_1fr] gap-6"
    >


      <!-- EDITOR -->

      <section
        class="bg-white/5 border border-white/10 rounded-3xl p-6 h-fit"
      >

        <div class="flex items-center justify-between mb-6">

          <div>

            <p
              class="text-amber-400 text-xs font-bold tracking-widest"
            >
              CONTENT
            </p>

            <h2 class="text-2xl font-bold">
              Create Post
            </h2>

          </div>

          <button
            id="resetBtn"
            class="text-xs text-slate-400"
          >
            Reset
          </button>

        </div>


        <form id="postForm">

          <input
            type="hidden"
            id="postId"
          >


          <label class="text-sm">
            Title
          </label>

          <input
            id="title"
            required
            class="mt-2 mb-4 w-full bg-black/20 border border-white/10 rounded-xl px-4 py-3 outline-none"
            placeholder="Navratri Wishes 2026 in Hindi"
          >


          <label class="text-sm">
            Category
          </label>

          <select
            id="category"
            class="mt-2 mb-4 w-full bg-slate-900 border border-white/10 rounded-xl px-4 py-3 outline-none"
          >

            <option>Wishes</option>
            <option>Quotes</option>
            <option>Status</option>
            <option>Messages</option>
            <option>Images</option>

          </select>


          <label class="text-sm">
            Festival
          </label>

          <select
            id="festival"
            class="mt-2 mb-4 w-full bg-slate-900 border border-white/10 rounded-xl px-4 py-3 outline-none"
          >

            <option>Navratri</option>
            <option>Dussehra</option>
            <option>Diwali</option>
            <option>Holi</option>
            <option>Chhath Puja</option>
            <option>Raksha Bandhan</option>
            <option>Janmashtami</option>
            <option>General</option>

          </select>


          <label class="text-sm">
            Year
          </label>

          <input
            id="year"
            type="number"
            value="2026"
            class="mt-2 mb-4 w-full bg-black/20 border border-white/10 rounded-xl px-4 py-3 outline-none"
          >


          <label class="text-sm">
            Short Description
          </label>

          <textarea
            id="excerpt"
            rows="3"
            class="mt-2 mb-4 w-full bg-black/20 border border-white/10 rounded-xl px-4 py-3 outline-none"
            placeholder="Short SEO-friendly description..."
          ></textarea>


          <label class="text-sm">
            Quotes / Content
          </label>

          <textarea
            id="content"
            required
            rows="9"
            class="mt-2 mb-4 w-full bg-black/20 border border-white/10 rounded-xl px-4 py-3 outline-none"
            placeholder="हर line एक अलग quote/message होगा..."
          ></textarea>


          <label class="text-sm">
            SEO Keywords
          </label>

          <input
            id="keywords"
            class="mt-2 mb-4 w-full bg-black/20 border border-white/10 rounded-xl px-4 py-3 outline-none"
            placeholder="Navratri Wishes 2026, Navratri Wishes in Hindi..."
          >


          <div class="flex gap-5 mb-5">

            <label class="flex items-center gap-2 text-sm">
              <input
                id="featured"
                type="checkbox"
              >
              Featured
            </label>

            <label class="flex items-center gap-2 text-sm">
              <input
                id="published"
                type="checkbox"
                checked
              >
              Published
            </label>

          </div>


          <button
            id="saveBtn"
            type="submit"
            class="w-full bg-amber-400 text-black font-bold py-3 rounded-xl"
          >
            Publish Post
          </button>

        </form>


        <p
          id="formMessage"
          class="text-sm mt-4 text-center text-slate-400"
        ></p>

      </section>


      <!-- POSTS -->

      <section>

        <div class="flex items-end justify-between mb-5">

          <div>

            <p class="text-xs text-amber-400 font-bold tracking-widest">
              DATABASE
            </p>

            <h2 class="text-2xl font-bold">
              Published Content
            </h2>

          </div>

          <span
            id="postCount"
            class="text-sm text-slate-500"
          >
            0 posts
          </span>

        </div>


        <div
          id="adminPosts"
          class="grid gap-3"
        ></div>

      </section>

    </div>

  </main>

</body>
</html>
