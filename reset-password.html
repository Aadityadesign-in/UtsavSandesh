
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | UtsavSandesh</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <!-- BA favicon -->
 <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='85'%3E✨%3C/text%3E%3C/svg%3E">


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #071426;
      color: white;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 30px;
      border-radius: 20px;
      background: #10243b;
      border: 1px solid #263b56;
    }

    h1 {
      margin-top: 0;
      color: #fb923c;
      text-align: center;
    }

    p {
      color: #cbd5e1;
      text-align: center;
    }

    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border-radius: 10px;
      font-size: 16px;
    }

    input {
      background: #071426;
      border: 1px solid #334155;
      color: white;
      outline: none;
    }

    button {
      background: #f97316;
      border: none;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
      font-size: 14px;
      text-align: center;
      overflow-wrap: anywhere;
    }

    a {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #fb923c;
    }
  </style>
</head>

<body>

<div class="card">
  <h1>नया Password</h1>
  <p>अपना नया Password सेट करें।</p>

  <form id="resetForm">
    <input
      type="password"
      id="newPassword"
      placeholder="नया Password"
      minlength="8"
      required
    >

    <input
      type="password"
      id="confirmPassword"
      placeholder="Confirm Password"
      minlength="8"
      required
    >

    <button type="submit" id="resetBtn">
      Password बदलें
    </button>
  </form>

  <div id="message"></div>

  <a href="admin.html">Admin Login पर वापस जाएँ</a>
</div>

<script>
  const supabaseClient = window.supabase.createClient(
    window.SUPABASE_CONFIG.url,
    window.SUPABASE_CONFIG.key
  );

  const form = document.getElementById("resetForm");
  const message = document.getElementById("message");
  const resetBtn = document.getElementById("resetBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const password =
      document.getElementById("newPassword").value;

    const confirmPassword =
      document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
      message.textContent = "दोनों Password समान नहीं हैं!";
      return;
    }

    if (password.length < 8) {
      message.textContent =
        "Password कम से कम 8 अक्षरों का होना चाहिए।";
      return;
    }

    resetBtn.disabled = true;
    resetBtn.textContent = "Updating...";
    message.textContent = "";

    try {
      const { error } =
        await supabaseClient.auth.updateUser({
          password: password
        });

      if (error) throw error;

      message.textContent =
        "Password सफलतापूर्वक बदल गया!";

      form.reset();

      setTimeout(() => {
          window.location.href = "admin.html";
      }, 2000);

    } catch (error) {
      message.textContent =
        "Error: " + error.message;
    } finally {
      resetBtn.disabled = false;
      resetBtn.textContent = "Password बदलें";
    }
  });
</script>

</body>
</html>
